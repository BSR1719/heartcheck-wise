name: HeartCheck Wise QA

on:
  push:
    branches: [main, v7.5-production-qa]
  pull_request:
    branches: [main]

jobs:
  safety-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check js/app.js
          node --check js/clinical-rules.js
          node --check js/package-checker.js
      - name: Clinical safety regression tests
        run: node tests/qa-tests.js
