name: Deploy PREVENT v2.3 UAT Preview

on:
  push:
    branches: ["prevent-v2-working-prototype"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-uat:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}uat/prevent-v2.3/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout UAT branch
        uses: actions/checkout@v4
        with:
          ref: prevent-v2-working-prototype
          path: uat-source

      - name: Build combined production + isolated UAT artifact
        run: |
          mkdir -p site/uat/prevent-v2.3
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            uat-source/ site/uat/prevent-v2.3/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy UAT preview without replacing production root content
        id: deployment
        uses: actions/deploy-pages@v4
