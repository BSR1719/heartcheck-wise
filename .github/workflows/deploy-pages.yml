name: Deploy HeartCheck Wise to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout PREVENT v2.3 UAT branch
        uses: actions/checkout@v4
        with:
          ref: prevent-v2-working-prototype
          path: uat-source

      - name: Build production root plus isolated UAT preview
        run: |
          mkdir -p site/uat/prevent-v2.3
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            uat-source/ site/uat/prevent-v2.3/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload combined static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
